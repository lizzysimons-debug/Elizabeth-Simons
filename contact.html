<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elizabeth A. Simons Portfolio | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italianno&family=La+Belle+Aurore&family=Lavishly+Yours&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Elizabeth A. Simons Portfolio home">
      <img class="brand__logo" src="assets/logo.png" alt="Elizabeth A. Simons monogram logo">
      <span class="brand__title">Elizabeth A. Simons <span>Portfolio</span></span>
    </a>

    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="skills-resume.html" data-page="skills-resume.html">Skills &amp; Resume</a>
      <a href="projects.html" data-page="projects.html">Projects</a>
      <a href="contact.html" data-page="contact.html">Contact</a>
    </nav>
  </header>

  <main class="contact-page" aria-label="Contact page content">
    <section class="postcard" aria-label="Contact postcard">
      <img class="postcard__paper" src="assets/contact-postcard.png" alt="">
      <img class="postcard__stamp" src="assets/contact-stamp.png" alt="Decorative postage stamp">

      <form class="contact-form" aria-label="Send Elizabeth a message">
        <label class="message-field">
          <span>Message</span>
          <textarea name="message" aria-label="Message"></textarea>
        </label>

        <label class="line-field line-field--name">
          <span>Name</span>
          <input type="text" name="name" aria-label="Name">
        </label>

        <label class="line-field line-field--email">
          <span>Email</span>
          <input type="email" name="email" aria-label="Email">
        </label>

        <button class="send-button" type="submit">Send</button>
      </form>

      <a class="mirror-link" href="index.html" aria-label="Return to home page">
        <img class="mirror-link__single" src="assets/mirror.png" alt="Elizabeth A. Simons portrait in a handheld mirror">
      </a>
    </section>
  </main>

  <footer class="site-footer">
    <a class="footer-link" href="#" aria-label="Open Elizabeth A. Simons Linktree">
      <img src="assets/footer-link.png" alt="Decorative footer link seal">
    </a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
